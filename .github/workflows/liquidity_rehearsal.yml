name: NIFTY liquidity delayed rehearsal
on:
  workflow_dispatch:
  push:
    paths: ['liquidity/**', 'rehearsal.py', 'test_*.py', 'config/**', '.github/workflows/liquidity_rehearsal.yml']
  schedule:
    - cron: '7,22,37,52 4-9 * * 1-5'
    - cron: '7 10 * * 1-5'
    - cron: '43 * * * *'
    - cron: '23 12 * * *'
permissions:
  contents: read
  issues: write
concurrency:
  group: nifty-personal-monitor
  cancel-in-progress: false
jobs:
  rehearsal:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 8582aa2d011196dfb370da8f935727ce7c68da6b
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m unittest -v
      - uses: actions/cache/restore@v4
        with:
          path: state.sqlite
          key: liquidity-state-${{ github.run_id }}
          restore-keys: liquidity-state-
      - name: Rehearsal health only; trade alerts disabled
        env:
          GH_TOKEN: ${{ github.token }}
        run: python rehearsal.py --publish-health --paper-followup
      - name: Daily historical backtest and frozen shadow learning
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch' || github.event.schedule == '23 12 * * *'
        env:
          GH_TOKEN: ${{ github.token }}
        run: python research.py --publish
      - uses: actions/cache/save@v4
        if: always()
        with:
          path: state.sqlite
          key: liquidity-state-${{ github.run_id }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: liquidity-rehearsal-${{ github.run_id }}
          path: reports/
          retention-days: 14

