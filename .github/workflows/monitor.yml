name: NIFTY 50 personal research monitor
on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'Normal scan, or after-hours source audit without signal alerts'
        type: choice
        default: scan
        options: [scan, audit]
  push:
    paths: ['monitor.py', 'test_monitor.py', 'requirements.txt', '.github/workflows/monitor.yml']
  schedule:
    # UTC: IST 09:37-16:22, every 15 min; after close catches delayed final bars.
    - cron: '7,22,37,52 4-9 * * 1-5'
    - cron: '7,22 10 * * 1-5'
permissions:
  contents: read
  issues: write
concurrency:
  group: nifty-personal-monitor
  cancel-in-progress: false
jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m unittest -v
      - name: Scan and notify
        env:
          GH_TOKEN: ${{ github.token }}
        run: python monitor.py --publish ${{ github.event.inputs.mode == 'audit' && '--audit' || '' }}
      - name: Keep coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-${{ github.run_id }}
          path: reports/latest.json
          retention-days: 7
